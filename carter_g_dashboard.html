<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carter's Goals</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--border:#e0ddd8;--text:#1a1a1a;--muted:#888;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a1a;--bg2:#242424;--border:#333;--text:#f0f0f0;--muted:#888;}
}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg2);font-size:13px;min-height:100vh;padding:12px;}
.dash{max-width:900px;margin:0 auto;}

/* HEADER */
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
.header-left{display:flex;align-items:center;gap:10px;}
.dash-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;line-height:1.1;}
.dash-title span{color:#1D6FA4;}
.dash-date{font-size:9px;color:var(--muted);margin-top:2px;}
.score-badge{border-radius:50%;border:2.5px solid #bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;width:58px;height:58px;}
.sb-lbl{font-size:7px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;opacity:0.6;}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;}
.countdowns-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.countdown-box{background:#111;color:#fff;border-radius:var(--radius);padding:5px 10px;text-align:center;flex-shrink:0;}
.cd-lbl{font-size:7px;letter-spacing:1px;text-transform:uppercase;opacity:0.5;margin-bottom:1px;}
.cd-days{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.cd-sub{font-size:7px;opacity:0.4;}

/* MAIN LAYOUT */
.main-layout{display:grid;grid-template-columns:1fr 3fr;gap:10px;}

/* TODO */
.todo-col{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;}
.todo-title{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.todo-tabs{display:flex;gap:0;margin-bottom:8px;border:0.5px solid var(--border);border-radius:5px;overflow:hidden;}
.todo-tab{flex:1;padding:4px;font-size:10px;font-weight:600;text-align:center;cursor:pointer;background:var(--bg2);color:var(--muted);border:none;font-family:'DM Sans',sans-serif;}
.todo-tab.active{background:#111;color:white;}
.todo-list{display:flex;flex-direction:column;gap:7px;flex:1;min-height:120px;}
.todo-item{display:flex;align-items:flex-start;gap:7px;cursor:pointer;user-select:none;}
.todo-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.todo-check.done{background:#2DC653;border-color:#2DC653;}
.todo-text{font-size:11px;line-height:1.3;transition:all 0.15s;}
.todo-text.done{text-decoration:line-through;opacity:0.4;}
.todo-empty{font-size:11px;color:var(--muted);opacity:0.6;}
.todo-add-row{display:flex;gap:5px;margin-top:8px;}
.todo-add-row input{flex:1;padding:4px 6px;font-size:11px;border:0.5px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);}
.todo-add-btn{padding:4px 8px;font-size:11px;font-weight:700;border-radius:5px;background:#111;color:white;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.todo-date{font-size:9px;color:var(--muted);margin-top:1px;}

/* TABS */
.dash-right{display:flex;flex-direction:column;gap:0;}
.tabs{display:flex;border-bottom:1.5px solid var(--border);margin-bottom:8px;}
.tab{padding:5px 12px;font-size:11px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.15s;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.sec{display:none;}
.sec.active{display:block;}

/* TODAY */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;}
.mc{border-radius:var(--radius);padding:7px 8px;border:0.5px solid var(--border);background:var(--bg);position:relative;overflow:hidden;}
.mc.empty{background:var(--bg2);border-style:dashed;}
.mc-lbl{font-size:8px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.mc-val{font-size:16px;font-weight:700;line-height:1;}
.mc-val.nd{font-size:10px;color:var(--muted);}
.mc-unit{font-size:8px;color:var(--muted);}
.mc-dot{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:white;}
.mc-bar{height:3px;border-radius:2px;margin-top:5px;}
.goal-bars{display:flex;flex-direction:column;gap:5px;}
.pmc-wrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:7px 8px;}
.pmc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.pmc-lbl{font-size:8px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;color:var(--muted);}
.pmc-val{font-size:11px;font-weight:700;}
.pmc-track{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;}
.pmc-fill{height:100%;border-radius:4px;transition:width 0.4s;}

/* LOG */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px;}
.lc{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;}
.lc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.lc-accent{width:3px;height:14px;border-radius:2px;flex-shrink:0;}
.lc-title{font-size:11px;font-weight:700;}
.lc-badge{margin-left:auto;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;color:white;}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.srow input[type=range]{flex:1;}
.sval{font-size:12px;font-weight:700;min-width:58px;text-align:right;}
.lc input[type=number]{width:100%;padding:3px 6px;font-size:11px;border:0.5px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);}
.yn-row{display:flex;gap:6px;margin-top:4px;}
.yn{flex:1;padding:5px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--bg2);color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.12s;}
.yn.y.active{background:#2DC653;border-color:#2DC653;color:white;}
.yn.n.active{background:#E63946;border-color:#E63946;color:white;}
.save-btn{width:100%;padding:8px;border-radius:var(--radius);background:#111;color:white;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;margin-top:4px;}
.save-btn:hover{opacity:0.8;}
.save-msg{text-align:center;font-size:11px;color:var(--muted);margin-top:5px;min-height:16px;}

/* WEEK */
.week-score-card{border-radius:var(--radius);padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1.5px solid var(--border);}
.ws-lbl{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;opacity:0.7;}
.ws-sub{font-size:10px;opacity:0.6;margin-top:2px;}
.ws-num{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;}
.ws-den{font-size:14px;opacity:0.4;}
.w2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wcard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;}
.wcard-title{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.wrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.wrow-lbl{font-size:10px;color:var(--muted);width:72px;flex-shrink:0;}
.wrow-track{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;}
.wrow-fill{height:100%;border-radius:3px;}
.wrow-val{font-size:10px;font-weight:500;width:52px;text-align:right;flex-shrink:0;}
.yn-dots{display:flex;gap:3px;}
.yn-dot{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.wcal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.wcal-lbl{font-size:8px;text-align:center;color:var(--muted);font-weight:500;}
.wcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.wcal-cell{border-radius:4px;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wcal-cell.nd{background:var(--bg2);}
.wcal-date{font-size:8px;font-weight:700;}
.wcal-score{font-family:'Bebas Neue',sans-serif;font-size:14px;color:white;line-height:1;}

/* HISTORY */
.hcontrols{display:flex;gap:5px;margin-bottom:6px;align-items:center;flex-wrap:wrap;}
.hcontrols select{padding:3px 6px;font-size:10px;border:0.5px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text);}
.vtoggle{display:flex;border:0.5px solid var(--border);border-radius:5px;overflow:hidden;}
.vbtn{padding:3px 8px;font-size:10px;cursor:pointer;background:var(--bg2);color:var(--muted);border:none;font-family:'DM Sans',sans-serif;}
.vbtn.active{background:var(--text);color:var(--bg);}
.chart-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:6px;height:175px;position:relative;}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px;}
.hstat{background:var(--bg2);border-radius:5px;padding:5px 8px;}
.hstat-lbl{font-size:9px;color:var(--muted);margin-bottom:2px;}
.hstat-val{font-size:15px;font-weight:700;}
.cal-wrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:6px;max-height:195px;overflow-y:auto;}
.cal-month{font-size:9px;font-weight:700;color:var(--muted);margin:4px 0;text-transform:uppercase;letter-spacing:0.5px;}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.cal-dlbl{font-size:8px;text-align:center;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
.cal-cell{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.cal-cell.nd{background:var(--bg2);}
.cal-dn{font-size:7px;position:absolute;top:1px;left:2px;}
.cal-sc{font-size:9px;font-weight:700;color:white;margin-top:5px;}

/* EDIT TAB */
.edit-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:10px;}
.edit-section-title{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--border);}
.edit-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);}
.edit-row:last-of-type{border-bottom:none;}
.edit-row-label{font-size:12px;font-weight:500;flex:1;}
.edit-row-sub{font-size:10px;color:var(--muted);}
.edit-btn{padding:4px 10px;font-size:11px;border-radius:5px;border:0.5px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;}
.edit-btn:hover{background:var(--border);}
.edit-btn.danger{border-color:#E63946;color:#E63946;}
.edit-btn.danger:hover{background:#E6394622;}
.edit-btn.primary{background:#111;color:white;border-color:#111;}
.add-form{background:var(--bg2);border-radius:var(--radius);padding:10px;margin-top:8px;display:none;}
.add-form.open{display:block;}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
.form-row label{font-size:10px;color:var(--muted);margin-bottom:2px;display:block;}
.form-row input,.form-row select{padding:5px 8px;font-size:12px;border:0.5px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
.form-group{display:flex;flex-direction:column;}
.form-actions{display:flex;gap:6px;margin-top:4px;}
.toggle-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.toggle-lbl{font-size:11px;color:var(--muted);}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;}
.toggle.on{background:#2DC653;}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:left 0.2s;}
.toggle.on .toggle-knob{left:18px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:16px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:10px;right:12px;font-size:18px;cursor:pointer;color:var(--muted);background:none;border:none;font-family:'DM Sans',sans-serif;}
.modal-date{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
.modal-section{margin-bottom:12px;}
.modal-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--border);}
.modal-metric-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px;}
.modal-todo-item{font-size:11px;padding:3px 0;color:var(--text);}
</style>
</head>
<body>
<div class="dash">

<div class="dash-header">
  <div class="header-left">
    <div>
      <div class="dash-title">CARTER'S<br><span>GOALS</span></div>
      <div class="dash-date" id="dashDate"></div>
        <div id="syncStatus" style="font-size:9px;margin-top:2px;"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="score-badge" id="scoreBadge">
        <div class="sb-lbl">Today</div>
        <div class="sb-val" id="scoreBadgeVal">—</div>
      </div>
      <div class="score-badge" id="scoreBadgeWeek">
        <div class="sb-lbl">Week</div>
        <div class="sb-val" id="scoreBadgeWeekVal">—</div>
      </div>
    </div>
  </div>
  <div class="countdowns-row" id="countdownsRow"></div>
</div>

<div class="main-layout">
  <div class="todo-col">
    <div class="todo-tabs">
      <button class="todo-tab active" id="todoTabTodo" onclick="switchTodoTab('todo')">To-Do</button>
      <button class="todo-tab" id="todoTabDone" onclick="switchTodoTab('done')">Completed</button>
    </div>
    <div class="todo-list" id="todoList"></div>
    <div class="todo-add-row" id="todoAddRow">
      <input type="text" id="todoInput" placeholder="Add item..." onkeydown="if(event.key==='Enter')addTodo()">
      <button class="todo-add-btn" onclick="addTodo()">+</button>
    </div>
  </div>

  <div class="dash-right">
    <div class="tabs">
      <div class="tab active" data-s="today">Today</div>
      <div class="tab" data-s="log">Log</div>
      <div class="tab" data-s="week">This Week</div>
      <div class="tab" data-s="history">History</div>
      <div class="tab" data-s="edit">Edit</div>
    </div>

    <div class="sec active" id="s-today">
      <div class="tgrid" id="todayGrid"></div>
      <div class="goal-bars" id="goalBars"></div>
    </div>

    <div class="sec" id="s-log">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;">Logging for</div>
        <input type="date" id="logDatePicker" style="padding:4px 8px;font-size:12px;border:0.5px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-family:'DM Sans',sans-serif;" onchange="changeLogDate()">
        <div style="font-size:11px;color:var(--muted)" id="logDateLabel"></div>
      </div>
      <div class="lgrid" id="logGrid"></div>
      <button class="save-btn" onclick="doSave()">Save</button>
      <div class="save-msg" id="saveMsg"></div>
    </div>

    <div class="sec" id="s-week">
      <div class="week-score-card" id="weekScoreCard"></div>
      <div class="w2col">
        <div class="wcard" id="weekRows"></div>
        <div class="wcard" id="weekCal"></div>
      </div>
    </div>

    <div class="sec" id="s-history">
      <div class="hcontrols">
        <select id="hMetric" onchange="renderHist()"><option value="overall">Overall score</option></select>
        <select id="hRange" onchange="renderHist()">
          <option value="14">14 days</option>
          <option value="30">30 days</option>
          <option value="365">365 days</option>
          <option value="9999">All time</option>
        </select>
        <div class="vtoggle">
          <button class="vbtn active" id="vChart" onclick="setHView('chart')">Chart</button>
          <button class="vbtn" id="vCal" onclick="setHView('cal')">Calendar</button>
        </div>
      </div>
      <div class="chart-card" id="chartWrap"><canvas id="hChart" role="img" aria-label="Historical metric chart">Historical data.</canvas></div>
      <div class="cal-wrap" id="calWrap" style="display:none;"></div>
      <div class="hstats" id="hStats"></div>
    </div>

    <div class="sec" id="s-edit">

      <!-- COUNTDOWNS -->
      <div class="edit-section">
        <div class="edit-section-title">Countdowns</div>
        <div id="editCountdowns"></div>
        <button class="edit-btn primary" style="margin-top:8px" onclick="toggleForm('addCountdownForm')">+ Add countdown</button>
        <div class="add-form" id="addCountdownForm">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input type="text" id="cdName" placeholder="e.g. My Birthday"></div>
            <div class="form-group"><label>Date</label><input type="date" id="cdDate"></div>
            <div class="form-group"><label>Color</label><input type="color" id="cdColor" value="#C77DFF" style="width:44px;height:34px;padding:2px;cursor:pointer;"></div>
          </div>
          <div class="form-actions">
            <button class="edit-btn primary" onclick="addCountdown()">Save</button>
            <button class="edit-btn" onclick="toggleForm('addCountdownForm')">Cancel</button>
          </div>
        </div>
      </div>

      <!-- METRICS -->
      <div class="edit-section">
        <div class="edit-section-title">Metrics</div>
        <div id="editMetrics"></div>
        <button class="edit-btn primary" style="margin-top:8px" onclick="toggleForm('addMetricForm')">+ Add metric</button>
        <div class="add-form" id="addMetricForm">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input type="text" id="mName" placeholder="e.g. Miles Run"></div>
            <div class="form-group"><label>Unit</label><input type="text" id="mUnit" placeholder="e.g. mi" style="width:70px"></div>
            <div class="form-group"><label>Type</label>
              <select id="mType" onchange="showMetricTypeFields()">
                <option value="yn">Yes / No</option>
                <option value="directional">Directional</option>
                <option value="middle">Middle is best</option>
              </select>
            </div>
          </div>
          <div id="mDirectionalFields" style="display:none;">
            <div class="form-row">
              <div class="form-group"><label>Best value (10/10)</label><input type="number" id="mBest" style="width:100px"></div>
              <div class="form-group"><label>Worst value (1/10)</label><input type="number" id="mWorst" style="width:100px"></div>
            </div>
          </div>
          <div id="mMiddleFields" style="display:none;">
            <div class="form-row">
              <div class="form-group"><label>Target / best value</label><input type="number" id="mTarget" style="width:100px"></div>
              <div class="form-group"><label>Worst range (± from target)</label><input type="number" id="mRange" style="width:100px" placeholder="e.g. 15"></div>
            </div>
          </div>
          <div class="form-actions">
            <button class="edit-btn primary" onclick="addMetric()">Save</button>
            <button class="edit-btn" onclick="toggleForm('addMetricForm')">Cancel</button>
          </div>
        </div>
      </div>

      <!-- GOAL BARS -->
      <div class="edit-section">
        <div class="edit-section-title">Weekly goal bars</div>
        <div id="editGoalBars"></div>
        <button class="edit-btn primary" style="margin-top:8px" onclick="toggleForm('addGoalBarForm')">+ Add goal bar</button>
        <div class="add-form" id="addGoalBarForm">
          <div class="form-row">
            <div class="form-group"><label>Bar name</label><input type="text" id="gbName" placeholder="e.g. Miles Run"></div>

// ─── SCORING ────────────────────────────────────────────────────
function calcScore(metric, val, weeklyTotals) {
  if (val===null||val===undefined) return null;
  if (metric.type==='yn') return val ? 10 : 1;
  if (metric.type==='risetime') {
    if (val <= 450) return 10;
    if (val <= 480) return 7;
    if (val <= 510) return 4;
    return 1;
  }
    if (metric.type==='directional') {
    var v = metric.isGoalMetric ? (weeklyTotals[metric.id]||0) : val;
    var r = (v - metric.worst) / (metric.best - metric.worst);
    r = Math.max(0, Math.min(1, r));
    return Math.round(r * 9 * 10) / 10 + 1;
  }
  if (metric.type==='middle') {
    var dist = Math.abs(val - metric.target);
    var range = metric.range || 15;
    var r2 = 1 - Math.min(1, dist / range);
    return Math.round(r2 * 9 * 10) / 10 + 1;
  }
  return null;
}

function scoreColor(sc) {
  if (sc===null||sc===undefined) return '#bbb';
  var t = (sc - 1) / 9;
  function lp(a,b,t) {
    function h(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
    var ca=h(a),cb=h(b);
    return '#'+[0,1,2].map(function(i){return Math.round(ca[i]+(cb[i]-ca[i])*t).toString(16).padStart(2,'0');}).join('');
  }
  if(t>=0.75) return lp('#90BE6D','#2DC653',(t-0.75)/0.25);
  if(t>=0.5)  return lp('#F4D06F','#90BE6D',(t-0.5)/0.25);
  if(t>=0.25) return lp('#F4845F','#F4D06F',(t-0.25)/0.25);
  return lp('#E63946','#F4845F',t/0.25);
}

function calcOverall(entry, weeklyTotals) {
  var nonGoalMetrics = settings.metrics.filter(function(m){return !m.isGoalMetric;});
  var scores = nonGoalMetrics.map(function(m){return calcScore(m, entry[m.id], weeklyTotals);}).filter(function(s){return s!==null;});
  if (!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length*10)/10;
}

// ─── DATE HELPERS ────────────────────────────────────────────────
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dback(n) {
  if (n===9999) {
    var keys=Object.keys(loggedData).filter(function(k){return k.match(/^\d{4}-\d{2}-\d{2}$/);}).sort();
    if(!keys.length) return [today()];
    var start=new Date(keys[0]+'T12:00:00'),end=new Date(),days=[];
    for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)) days.push(localDateStr(new Date(d)));
    return days;
  }
  var days=[];
  for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(localDateStr(d));}
  return days;
}
function wdays(){ return dback(7); }
// Returns Mon-Sun of current week
function currentWeekDays(){
  var days=[];
  var now=new Date();
  var dow=now.getDay(); // 0=Sun
  var mondayOffset=dow===0?-6:1-dow;
  for(var i=0;i<7;i++){
    var d=new Date(now);
    d.setDate(now.getDate()+mondayOffset+i);
    days.push(localDateStr(d));
  }
  return days;
}
function calcWeekAvg(){
  var wt=getWeeklyTotals();
  var days=currentWeekDays();
  var scores=days.map(function(d){
    return loggedData[d]?calcOverall(loggedData[d],wt):null;
  }).filter(function(s){return s!==null;});
  if(!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length*10)/10;
}

function currentWeekDays(){
  var days=[];
  var now=new Date();
  var dow=now.getDay();
  var mondayOffset=dow===0?-6:1-dow;
  for(var i=0;i<7;i++){
    var d=new Date(now);
    d.setDate(now.getDate()+mondayOffset+i);
    days.push(localDateStr(d));
  }
  return days;
}
function calcWeekAvg(){
  var wt=getWeeklyTotals();
  var days=currentWeekDays();
  var scores=days.map(function(d){
    return loggedData[d]?calcOverall(loggedData[d],wt):null;
  }).filter(function(s){return s!==null;});
  if(!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length*10)/10;
}

function getWeeklyTotals() {
  var totals = {};
  settings.goalBars.forEach(function(gb){
    if(gb.isYN) {
      totals[gb.metricId] = wdays().reduce(function(s,d){
        return s + ((loggedData[d]&&loggedData[d][gb.metricId]===true)?1:0);
      },0);
    } else {
      totals[gb.metricId] = wdays().reduce(function(s,d){return s+((loggedData[d]&&loggedData[d][gb.metricId])||0);},0);
    }
  });
  return totals;
}

function switchTodoTab(tab) {
  todoView = tab;
  document.getElementById('todoTabTodo').classList.toggle('active', tab==='todo');
  document.getElementById('todoTabDone').classList.toggle('active', tab==='done');
  document.getElementById('todoAddRow').style.display = tab==='todo' ? 'flex' : 'none';
  renderTodos();
}

function getLastSunday() {
  var d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0,10);
}

function renderTodos() {
  var list = document.getElementById('todoList');
  var lastSunday = getLastSunday();
  
  if (todoView === 'todo') {
    var pending = todos.filter(function(t){ return !t.dateCompleted; });
    if (!pending.length) { list.innerHTML='<div class="todo-empty">No items yet</div>'; return; }
    list.innerHTML = pending.map(function(t){
      return '<div class="todo-item" onclick="completeTodo(\''+t.id+'\')">'
        +'<div class="todo-check"></div>'
        +'<div style="flex:1"><div class="todo-text">'+t.todo+'</div></div>'
        +'</div>';
    }).join('');
  } else {
    var completed = todos.filter(function(t){ 
      return t.dateCompleted && t.dateCompleted >= lastSunday; 
    });
    if (!completed.length) { list.innerHTML='<div class="todo-empty">Nothing completed this week</div>'; return; }
    list.innerHTML = completed.map(function(t){
      return '<div class="todo-item">'
        +'<div class="todo-check done"></div>'
        +'<div style="flex:1"><div class="todo-text done">'+t.todo+'</div>'
        +'<div class="todo-date">'+t.dateCompleted+'</div></div>'
        +'</div>';
    }).join('');
  }
}

function addTodo() {
  var inp = document.getElementById('todoInput');
  var text = inp.value.trim(); if(!text) return;
  var newTodo = {
    id: 'todo_' + Date.now(),
    todo: text,
    dateCreated: today(),
    dateCompleted: ''
  };
  todos.push(newTodo);
  inp.value = '';
  renderTodos();
  // Sync to sheet
  apiCall({action:'saveTodo', user:SYNC_USER, todo:JSON.stringify(newTodo)}, function(){});
}

function completeTodo(id) {
  var t = todos.find(function(x){ return x.id===id; });
  if (!t) return;
  t.dateCompleted = today();
  renderTodos();
  // Sync to sheet
  apiCall({action:'completeTodo', user:SYNC_USER, todoId:id, dateCompleted:today()}, function(){});
}

function syncTodosFromSheet(callback) {
  apiCall({action:'getTodos', user:SYNC_USER}, function(err, res) {

// ─── COUNTDOWNS ─────────────────────────────────────────────────
function renderCountdowns() {

// ─── TODAY ───────────────────────────────────────────────────────
function renderToday() {
  var e = loggedData[today()]||{};
  var wt = getWeeklyTotals();

  // Daily score badge
  var ov = calcOverall(e, wt);
  var oc = scoreColor(ov);
  var badge = document.getElementById('scoreBadge');
  badge.style.borderColor = ov!==null?oc:'#bbb';
  var bval = document.getElementById('scoreBadgeVal');
  bval.style.color = ov!==null?oc:'var(--muted)';
  bval.textContent = ov!==null?ov:'—';

  // Weekly score badge (Mon-Sun average of daily scores)
  var weekBadge = document.getElementById('scoreBadgeWeek');
  var weekVal = document.getElementById('scoreBadgeWeekVal');
  if (weekBadge) {
    var wa = calcWeekAvg();
    var wc = scoreColor(wa);
    weekBadge.style.borderColor = wa!==null?wc:'#bbb';
    weekVal.style.color = wa!==null?wc:'var(--muted)';

  }

  var nonGoal = settings.metrics.filter(function(m){return !m.isGoalMetric;});
  var html = '';
  nonGoal.forEach(function(m){
    var v=e[m.id]; var has=v!==null&&v!==undefined;
    var sc=has?calcScore(m,v,wt):null; var c=scoreColor(sc);
    var disp=!has?'No data':(m.type==='yn'?(v?'YES':'NO'):m.type==='risetime'?minutesToTimeStr(v):v);
    html+='<div class="mc'+((!has)?' empty':'')+'">'+
      '<div class="mc-lbl">'+m.label+'</div>'+
      '<div class="mc-val'+((!has)?' nd':'')+'"'+(has?' style="color:'+c+'"':'')+'>'+disp+'</div>'+
      '<div class="mc-unit">'+(has&&m.type!=='yn'?m.unit:'')+'</div>'+
      (has&&sc!==null?'<div class="mc-dot" style="background:'+c+'">'+Math.round(sc)+'</div>':'')+
      (has?'<div class="mc-bar" style="background:'+c+'"></div>':'')+
    '</div>';
  });
  document.getElementById('todayGrid').innerHTML = html;

  // Goal bars
  var barsHtml = '';
  settings.goalBars.forEach(function(gb){
    var total = wt[gb.metricId]||0;
    var goalMet = total >= gb.target;
    var pct = Math.min(100, Math.round(total/gb.target*100));
    var fillColor = goalMet?'#2DC653':pct>=70?'#90BE6D':pct>=40?'#F4D06F':'#E63946';
    var displayTotal = gb.isYN ? Math.round(total)+' '+gb.unit : Math.round(total*10)/10+' '+gb.unit;
    var label = goalMet?(displayTotal+' ✓'):(displayTotal+' / '+gb.target+' '+gb.unit);
    barsHtml+='<div class="pmc-wrap">'+
      '<div class="pmc-top"><div class="pmc-lbl">'+gb.label+'</div>'+
      '<div class="pmc-val" style="color:'+(goalMet?'#2DC653':'var(--text)')+'">'+label+'</div></div>'+
      '<div class="pmc-track"><div class="pmc-fill" style="width:'+pct+'%;background:'+fillColor+'"></div></div>'+
    '</div>';
  });
  document.getElementById('goalBars').innerHTML = barsHtml;
}

function minutesToTimeStr(mins) {
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  var ampm = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12 || 12;
  return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

function renderLog() {
  var e = loggedData[logDate]||{};
  ls = {}; for(var k in e) ls[k]=e[k];
  // Auto-populate Workout if bike/swim/run > 0 or gym = true
  if (ls.workout === undefined) {
    var hasActivity = (ls.bike && ls.bike > 0) || (ls.swim && ls.swim > 0) || (ls.run && ls.run > 0) || ls.gym === true;
    if (hasActivity) ls.workout = true;
  }
  var wt = getWeeklyTotals();
  var allMetrics = settings.metrics;
  var html = '';
  allMetrics.forEach(function(m){
    var v=ls[m.id]; var sc=v!==undefined?calcScore(m,v,wt):null; var c=scoreColor(sc);
    html+='<div class="lc"><div class="lc-top"><div class="lc-accent" style="background:'+m.col+'"></div><div class="lc-title">'+m.label+'</div>';
    if(sc!==null) html+='<div class="lc-badge" id="lc-badge-'+m.id+'" style="background:'+c+'">'+Math.round(sc)+'/10</div>';
    html+='</div>';
    if(m.type==='yn'){
      html+='<div class="yn-row">'+
        '<button class="yn y'+(v===true?' active':'')+'" id="yn-y-'+m.id+'" onclick="setYN(\''+m.id+'\',true)">YES</button>'+
        '<button class="yn n'+(v===false?' active':'')+'" id="yn-n-'+m.id+'" onclick="setYN(\''+m.id+'\',false)">NO</button>'+
      '</div>';
    } else if(m.type==='risetime'){
      var cur = v!==undefined ? v : 450;
      cur = Math.max(m.sliderMin, Math.min(m.sliderMax, cur));
      var touched = v!==undefined;
      html+='<div class="srow">'+
        '<input type="range" min="'+m.sliderMin+'" max="'+m.sliderMax+'" step="'+m.step+'" value="'+cur+'" id="slider_'+m.id+'" data-id="'+m.id+'" oninput="updLog(this.dataset.id,+this.value);">'+
        '<div class="sval" id="sv_'+m.id+'" style="color:'+(touched?c:'var(--muted)')+'">'+(touched?minutesToTimeStr(cur):'—')+'</div>'+
      '</div>';
    } else {
      var cur=v!==undefined?v:(m.goal||m.best||0);
      var sliderMin, sliderMax, sliderStep;
      if(m.sliderMin!==undefined && m.sliderMax!==undefined){
        sliderMin=m.sliderMin; sliderMax=m.sliderMax;
      } else {
        var lo=Math.min(m.best||0,m.worst||0);
        var hi=Math.max(m.best||0,m.worst||0);
        var pad=Math.round((hi-lo)*0.2)||5;
        sliderMin=Math.max(0,lo-pad);
        sliderMax=hi+pad;
      }
      sliderStep=m.step||0.5;
      cur=Math.max(sliderMin,Math.min(sliderMax,cur));
      var touched = v!==undefined; // only show value if already logged
      html+='<div class="srow">'+
        '<input type="range" min="'+sliderMin+'" max="'+sliderMax+'" step="'+sliderStep+'" value="'+cur+'" id="slider_'+m.id+'" oninput="updLog(\''+m.id+'\',+this.value);var ni=document.getElementById(\'ni_'+m.id+'\');if(ni)ni.value=this.value;">'+
        '<div class="sval" id="sv_'+m.id+'" style="color:'+(touched?c:'var(--muted)')+'">'+(touched?cur:'—')+' <span style="font-size:9px;font-weight:400">'+m.unit+'</span></div>'+
      '</div>'+
      '<input type="number" id="ni_'+m.id+'" placeholder="Type exact..." step="'+sliderStep+'" min="'+sliderMin+'" oninput="updLog(\''+m.id+'\',+this.value);var sl=document.getElementById(\'slider_'+m.id+'\');if(sl)sl.value=Math.min('+sliderMax+',Math.max('+sliderMin+',+this.value));">';
    }
    html+='</div>';
  });
  document.getElementById('logGrid').innerHTML = html;
}

function updLog(id,val){
  ls[id]=val;
  // Auto-populate Workout
  if (id==='bike'||id==='swim'||id==='run'||id==='gym') {
    var hasActivity = (ls.bike&&ls.bike>0)||(ls.swim&&ls.swim>0)||(ls.run&&ls.run>0)||ls.gym===true;
    if (hasActivity && ls.workout===undefined) {
      ls.workout = true;
      var yBtn=document.getElementById('yn-y-workout');
      var nBtn=document.getElementById('yn-n-workout');
      if(yBtn) yBtn.classList.add('active');
      if(nBtn) nBtn.classList.remove('active');
    }
  }
  var wt=getWeeklyTotals();
  var m=null; settings.metrics.forEach(function(x){if(x.id===id) m=x;});
  if(m){
    var sc=calcScore(m,val,wt);
    var c=scoreColor(sc);
    var badge=document.getElementById('lc-badge-'+id);
    var sval=document.getElementById('sv_'+id);
    if(badge){badge.style.background=c;badge.textContent=Math.round(sc)+'/10';}
    if(sval){
      sval.style.color=c;
      if(m.type==='risetime'){
        sval.textContent=minutesToTimeStr(val);
      } else {
        sval.innerHTML=val+' <span style="font-size:9px;font-weight:400">'+m.unit+'</span>';
      }
    }
    // Show badge if not already visible
    if(badge===null){
      var top=document.querySelector('#lc-badge-'+id);
      if(!top){
        var lctop=document.getElementById('slider_'+id);
        if(lctop&&lctop.parentElement&&lctop.parentElement.parentElement){
          var header=lctop.parentElement.parentElement.querySelector('.lc-top');
          if(header){
            var b=document.createElement('div');
            b.className='lc-badge';
            b.id='lc-badge-'+id;
            b.style.background=c;
            b.textContent=Math.round(sc)+'/10';
            header.appendChild(b);
          }
        }
      }
    }
  }
}
function setYN(id,val){
  ls[id]=val;
  var yBtn=document.getElementById('yn-y-'+id);
  var nBtn=document.getElementById('yn-n-'+id);
  if(yBtn) yBtn.classList.toggle('active',val===true);
  if(nBtn) nBtn.classList.toggle('active',val===false);
}
function doSave(){
  // Only save metrics that have been explicitly set
  var entry={};
  var hasAnyData=false;
  for(var k in ls){
    if(ls[k]!==undefined && ls[k]!==null && k!=='savedAt'){
      entry[k]=ls[k];
      hasAnyData=true;
    }
  }
  if(!hasAnyData){
    document.getElementById('saveMsg').textContent='Nothing to save — log some values first';
    setTimeout(function(){document.getElementById('saveMsg').textContent='';},3000);
    return;
  }
  entry.date=logDate;
  entry.savedAt=new Date().toISOString();
  // Calculate and save overall score
  var wt=getWeeklyTotals();
  var ov=calcOverall(entry,wt);
  if(ov!==null) entry.overall=ov;
  loggedData[logDate]=entry; saveData();
  document.getElementById('saveMsg').textContent='Saved ✓';
  setTimeout(function(){document.getElementById('saveMsg').textContent='';},3000);
  renderToday();
  syncDayToSheet(logDate, entry);
}

// ─── WEEK ────────────────────────────────────────────────────────
function renderWeek() {
  var days=wdays(); var wt=getWeeklyTotals();
  var logged=days.filter(function(d){return loggedData[d]&&Object.keys(loggedData[d]).filter(function(k){return k!=='savedAt';}).length>0;});
  var scores=logged.map(function(d){return calcOverall(loggedData[d]||{},wt);}).filter(function(s){return s!==null;});
  var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length*10)/10:null;
  var ac=scoreColor(avg);
  var wsc=document.getElementById('weekScoreCard');
  wsc.style.background=avg!==null?ac+'22':'var(--bg2)';
  wsc.style.border='1.5px solid '+(avg!==null?ac+'66':'var(--border)');
  wsc.innerHTML='<div><div class="ws-lbl">Week score</div><div class="ws-sub">'+logged.length+' day'+(logged.length!==1?'s':'')+' logged</div></div>'+
    '<div class="ws-num" style="color:'+(avg!==null?ac:'var(--muted)')+';">'+(avg!==null?avg:'—')+'<span class="ws-den">/10</span></div>';

  var dl=days.map(function(d){var dt=new Date(d+'T12:00:00');return ['Su','Mo','Tu','We','Th','Fr','Sa'][dt.getDay()][0];});
  var nonGoal=settings.metrics.filter(function(m){return !m.isGoalMetric;});
  var rhtml='<div class="wcard-title">Averages</div>';
  nonGoal.forEach(function(m){
    if(m.type==='yn'){
      var dots=days.map(function(d,i){
        var v=loggedData[d]&&loggedData[d][m.id];
        var hasV=loggedData[d]&&loggedData[d][m.id]!==undefined;
        var bg=v===true?'#2DC653':(v===false?'#E63946':'var(--bg2)');
        var tc=hasV?'white':'var(--muted)';
        return '<div class="yn-dot" style="background:'+bg+';color:'+tc+'">'+dl[i]+'</div>';
      }).join('');
      var ct=days.filter(function(d){return loggedData[d]&&loggedData[d][m.id]===true;}).length;
      var lg=days.filter(function(d){return loggedData[d]&&loggedData[d][m.id]!==undefined;}).length;
      rhtml+='<div class="wrow"><div class="wrow-lbl">'+m.label+'</div><div class="yn-dots">'+dots+'</div><div class="wrow-val">'+ct+'/'+lg+'d</div></div>';
    } else {
      var vals=days.map(function(d){return loggedData[d]?loggedData[d][m.id]:undefined;}).filter(function(v){return v!==undefined&&v!==null;});
      var av=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
      var sc=av!==null?calcScore(m,av,wt):null; var cl=scoreColor(sc);
      var mn=Math.min(m.best||0,m.worst||0),mx=Math.max(m.best||0,m.worst||0);
      var bp=av!==null?Math.min(100,Math.round((av-mn)/(mx-mn)*100)):0;
      rhtml+='<div class="wrow"><div class="wrow-lbl">'+m.label+'</div><div class="wrow-track"><div class="wrow-fill" style="width:'+bp+'%;background:'+cl+'"></div></div><div class="wrow-val" style="color:'+cl+'">'+(av!==null?(Math.round(av*10)/10)+' '+m.unit:'—')+'</div></div>';
    }
  });
  settings.goalBars.forEach(function(gb){
    var total=Math.round(wt[gb.metricId]||0);
    var sc=Math.max(1,Math.min(10,Math.round(total/gb.target*9)+1));
    var cl=scoreColor(sc);
    rhtml+='<div class="wrow" style="border-top:0.5px solid var(--border);padding-top:5px;margin-top:3px;">'+
      '<div class="wrow-lbl" style="font-weight:700">'+gb.label+'</div>'+
      '<div class="wrow-track"><div class="wrow-fill" style="width:'+Math.min(100,Math.round(total/gb.target*100))+'%;background:'+cl+'"></div></div>'+
      '<div class="wrow-val" style="color:'+cl+';font-weight:700">'+total+' '+gb.unit+'</div></div>';
  });
  document.getElementById('weekRows').innerHTML=rhtml;

  var dow=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var chtml='<div class="wcard-title">Daily scores</div><div class="wcal-hdr">'+dow.map(function(l){return '<div class="wcal-lbl">'+l+'</div>';}).join('')+'</div><div class="wcal-grid">';
  var fd=new Date(days[0]+'T12:00:00').getDay();
  for(var i=0;i<fd;i++) chtml+='<div></div>';
  days.forEach(function(d){
    var dt=new Date(d+'T12:00:00');
    var ov=calcOverall(loggedData[d]||{},wt); var cl=scoreColor(ov); var has=ov!==null;
    chtml+='<div class="wcal-cell'+((!has)?' nd':'')+'"'+(has?' style="background:'+cl+'"':'')+'>'+
      '<div class="wcal-date" style="color:'+(has?'rgba(255,255,255,0.8)':'var(--muted)')+'">'+dt.getDate()+'</div>'+
      (has?'<div class="wcal-score">'+Math.round(ov)+'</div>':'')+
    '</div>';
  });
  chtml+='</div>';
  document.getElementById('weekCal').innerHTML=chtml;
}

function setHView(v){
  hView=v;
  document.getElementById('vChart').classList.toggle('active',v==='chart');
  document.getElementById('vCal').classList.toggle('active',v==='cal');
  document.getElementById('chartWrap').style.display=v==='chart'?'block':'none';
  document.getElementById('calWrap').style.display=v==='cal'?'block':'none';
  renderHist();

function renderHist(){
  var metric=document.getElementById('hMetric').value;
  var range=parseInt(document.getElementById('hRange').value);
  var days=dback(range); var wt=getWeeklyTotals();
  var m=null;
  settings.metrics.forEach(function(x){if(x.id===metric) m=x;});
  var vals=days.map(function(d){
    if(metric==='overall') return calcOverall(loggedData[d]||{},wt);
    return loggedData[d]?(loggedData[d][metric]!==undefined?loggedData[d][metric]:null):null;
  });
  var scores=vals.map(function(v){if(v===null) return null;return metric==='overall'?v:calcScore(m,v,wt);});
  var colors=scores.map(scoreColor);
  var nums=vals.filter(function(v){return v!==null;});

  if(hView==='chart'){
    var labels=days.map(function(d){var dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+(dt.getDate());});
    if(hChart) hChart.destroy();
    var datasets=[{data:vals,borderColor:'#457B9D',backgroundColor:'#457B9D22',pointBackgroundColor:colors,pointRadius:days.length<=14?5:days.length<=30?3:1,fill:true,tension:0.4,spanGaps:true,borderWidth:2}];
    // Add goal line if metric has a goal and is not yn or overall
    if(m && m.goal!==undefined && m.type!=='yn'){
      var goalData=days.map(function(){return m.goal;});
      datasets.push({data:goalData,borderColor:'rgba(255,255,255,0.4)',borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false,tension:0,label:'Goal'});
    }
    hChart=new Chart(document.getElementById('hChart'),{
      type:'line',
      data:{labels:labels,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:true,maxRotation:45,font:{size:10}},grid:{display:false}},y:{ticks:{font:{size:10}}}}}
    });
  } else {
    var months={};
    days.forEach(function(d,i){
      var dt=new Date(d+'T12:00:00');var mk=dt.getFullYear()+'-'+dt.getMonth();
      if(!months[mk]) months[mk]={lbl:dt.toLocaleDateString('en-US',{month:'long',year:'numeric'}),items:[],year:dt.getFullYear(),month:dt.getMonth()};
      months[mk].items.push({d:d,dt:dt,v:vals[i],c:colors[i],sc:scores[i]});
    });
    var dow=['Su','Mo','Tu','We','Th','Fr','Sa'];
    var html='';
    Object.keys(months).forEach(function(mk){
      var mo=months[mk];
      html+='<div class="cal-month">'+mo.lbl+'</div>'+
        '<div class="cal-hdr">'+dow.map(function(l){return '<div class="cal-dlbl">'+l+'</div>';}).join('')+'</div>'+
        '<div class="cal-grid">';
      // Find the first day of the month to get correct alignment
      var firstOfMonth=new Date(mo.year,mo.month,1);
      var startDow=firstOfMonth.getDay();
      // Add empty cells for days before the 1st
      for(var i=0;i<startDow;i++) html+='<div class="cal-cell nd"></div>';
      // Build a map of day number to item
      var dayMap={};
      mo.items.forEach(function(item){dayMap[item.dt.getDate()]=item;});
      // Render all days of the month
      var daysInMonth=new Date(mo.year,mo.month+1,0).getDate();
      for(var d=1;d<=daysInMonth;d++){
        var item=dayMap[d];
        // Only show days that are within our range
        if(!item){
          // Check if this day is within the range
          var thisDate=new Date(mo.year,mo.month,d);
          var rangeStart=new Date(days[0]+'T12:00:00');
          var rangeEnd=new Date(days[days.length-1]+'T12:00:00');
          if(thisDate<rangeStart||thisDate>rangeEnd){
            html+='<div class="cal-cell" style="opacity:0.15"><div class="cal-dn" style="color:var(--muted)">'+d+'</div></div>';
          } else {
            html+='<div class="cal-cell nd"><div class="cal-dn" style="color:var(--muted)">'+d+'</div></div>';
          }
        } else {
          var has=item.v!==null&&item.v!==undefined;
          var dayStr=mo.year+'-'+String(mo.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          var dayTodos=todos.filter(function(t){return t.dateCompleted===dayStr;});
          var todoBadge=dayTodos.length>0?'<div style="position:absolute;bottom:2px;right:2px;background:rgba(255,255,255,0.3);border-radius:3px;font-size:7px;font-weight:700;padding:0 2px;color:white;">'+dayTodos.length+'✓</div>':'';
          html+='<div class="cal-cell'+((!has)?' nd':'')+'"'+(has?' style="background:'+item.c+';cursor:pointer"':' style="cursor:pointer"')+' onclick="openDayModal(\''+dayStr+'\')" >'+
            '<div class="cal-dn" style="color:'+(has?'rgba(255,255,255,0.75)':'var(--muted)')+'">'+d+'</div>'+
            (has&&item.sc!==null?'<div class="cal-sc">'+Math.round(item.sc)+'</div>':'')+
            todoBadge+
          '</div>';
        }
      }
      html+='</div>';
    });
    document.getElementById('calWrap').innerHTML=html;
  }

  var st=document.getElementById('hStats');
  if(!nums.length){st.innerHTML='<div style="color:var(--muted);font-size:11px;grid-column:span 4">No data yet.</div>';return;}
  var av=nums.reduce(function(a,b){return a+b;},0)/nums.length;
  st.innerHTML=[
    {l:'Average',v:(Math.round(av*10)/10)+(m&&m.unit?' '+m.unit:'')},
    {l:'Best',v:(Math.round(Math.max.apply(null,nums)*10)/10)+(m&&m.unit?' '+m.unit:'')},
    {l:'Worst',v:(Math.round(Math.min.apply(null,nums)*10)/10)+(m&&m.unit?' '+m.unit:'')},
    {l:'Days logged',v:nums.length+'/'+days.length}
  ].map(function(s){return '<div class="hstat"><div class="hstat-lbl">'+s.l+'</div><div class="hstat-val">'+s.v+'</div></div>';}).join('');
}

function addMetric(){
  var name=document.getElementById('mName').value.trim();
  var unit=document.getElementById('mUnit').value.trim();
  var type=document.getElementById('mType').value;

  var id=name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');

  saveSettings(); toggleForm('addMetricForm');
  document.getElementById('mName').value=''; document.getElementById('mUnit').value='';
  renderEdit(); populateHistMetric();
}

function deleteMetric(i){
  if(!confirm('Delete this metric? Historical data will be kept in History tab.')) return;
  settings.metrics.splice(i,1); saveSettings();
  renderEdit(); renderToday(); renderLog(); populateHistMetric();
}

function addGoalBar(){
  var name=document.getElementById('gbName').value.trim();
  var unit=document.getElementById('gbUnit').value.trim();
  var target=parseFloat(document.getElementById('gbTarget').value)||0;
  var createNew=document.getElementById('gbCreateMetricToggle').classList.contains('on');
  var metricId;
  if(createNew){
    var mtype=document.getElementById('gbMType').value;

    var mworst=parseFloat(document.getElementById('gbMWorst').value)||0;

function deleteGoalBar(i){

// ─── GOOGLE SHEETS SYNC ─────────────────────────────────────────
var API_URL = 'https://script.google.com/macros/s/AKfycby-3pY7Yr0PBUn5criqtLnVnWN4GNmD-GV3kDZrzkv4ZXxpMN8NlPmKcRbNmDJDh2aZ/exec';
var SYNC_USER = 'Carter G';
var syncStatus = 'idle'; // idle, syncing, ok, error

function apiCall(params, callback) {
  var url = API_URL + '?' + Object.keys(params).map(function(k){
    return k + '=' + encodeURIComponent(params[k]);
  }).join('&');
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){callback(null,d);})
    .catch(function(e){callback(e,null);});
}

function setSyncStatus(s, msg) {
  syncStatus = s;
  var el = document.getElementById('syncStatus');
  if (!el) return;
  var colors = {idle:'var(--muted)', syncing:'#F4D06F', ok:'#2DC653', error:'#E63946'};
  var labels = {idle:'', syncing:'Syncing...', ok:'Synced ✓', error:'Sync error — using local data'};
  el.style.color = colors[s];
  el.textContent = msg || labels[s];
}

function syncFromSheet(callback, retryCount) {
  retryCount = retryCount || 0;
  setSyncStatus('syncing');
  apiCall({action:'getSettings', user:SYNC_USER}, function(err, res) {
    if (!err && res && res.success && res.settings && res.settings.metrics) {
      settings = res.settings;
      // Filter out any null/undefined entries
      settings.metrics = settings.metrics.filter(function(m){ return m !== null && m !== undefined; });
      settings.goalBars = (settings.goalBars||[]).filter(function(g){ return g !== null && g !== undefined; });
      settings.countdowns = (settings.countdowns||[]).filter(function(c){ return c !== null && c !== undefined; });
      // Filter out any null/undefined metrics
      settings.metrics = settings.metrics.filter(function(m){ return m !== null && m !== undefined; });
      settings.goalBars = (settings.goalBars||[]).filter(function(g){ return g !== null && g !== undefined; });
      settings.countdowns = (settings.countdowns||[]).filter(function(c){ return c !== null && c !== undefined; });
      var goalDefaults={weightAM:122,weightPM:122,sleep:8,screenTime:1,calories:2000,bikeMiles:60};
      var sliderDefaults={weightAM:{sliderMin:100,sliderMax:200,step:0.5},weightPM:{sliderMin:100,sliderMax:200,step:0.5},sleep:{sliderMin:0,sliderMax:12,step:0.5},screenTime:{sliderMin:0,sliderMax:12,step:0.5},calories:{sliderMin:1000,sliderMax:4000,step:50},bikeMiles:{sliderMin:0,sliderMax:150,step:0.5}};
      settings.metrics.forEach(function(m){
        if(m.type!=='yn'&&m.goal===undefined) m.goal=goalDefaults[m.id]!==undefined?goalDefaults[m.id]:m.best;
        if(m.sliderMin===undefined&&sliderDefaults[m.id]){m.sliderMin=sliderDefaults[m.id].sliderMin;m.sliderMax=sliderDefaults[m.id].sliderMax;m.step=sliderDefaults[m.id].step;}
      });
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } else if (retryCount < 3) {
      setSyncStatus('syncing', 'Warming up...');
      setTimeout(function(){ syncFromSheet(callback, retryCount + 1); }, 5000);
      return;
    }
    apiCall({action:'getData', user:SYNC_USER}, function(err2, res2) {
      if (!err2 && res2 && res2.success) {
        // Sheet is source of truth — completely replace local data with sheet data
        var freshData = {};
        res2.data.forEach(function(row) {
          if (row.date) {
            var dateKey = String(row.date).slice(0, 10);
            var entry = {};
            Object.keys(row).forEach(function(k){
              if(row[k]!==''&&row[k]!==null&&row[k]!==undefined){
                var v = row[k];
                // Convert string TRUE/FALSE to booleans
                if(v==='TRUE'||v===true) v=true;
                else if(v==='FALSE'||v===false) v=false;
                entry[k]=v;
              }
            });
            entry.date = dateKey;
            freshData[dateKey] = entry;
          }
        });
        loggedData = freshData;
        localStorage.setItem(SK, JSON.stringify(loggedData));
        setSyncStatus('ok');
      } else {
        setSyncStatus('error');
      }
      if (callback) callback();
    });
  });
}

function syncDayToSheet(date, entry) {
  setSyncStatus('syncing');
  var day = {date: date};
  Object.keys(entry).forEach(function(k){ day[k] = entry[k]; });
  apiCall({action:'saveDay', user:SYNC_USER, day:JSON.stringify(day)}, function(err, res) {
    if (!err && res && res.success) { setSyncStatus('ok'); }
    else { setSyncStatus('error', 'Save error — data kept locally'); }
  });
}

function syncSettingsToSheet() {
  setSyncStatus('syncing');
  apiCall({action:'saveSettings', user:SYNC_USER, settings:JSON.stringify(settings)}, function(err, res) {
    if (!err && res && res.success) { setSyncStatus('ok'); }
    else { setSyncStatus('error', 'Settings sync error'); }
  });
}

function migrateLocalToSheet() {
  var localData = {};
  try { localData = JSON.parse(localStorage.getItem(SK)||'{}'); } catch(e){}
  var dates = Object.keys(localData).filter(function(k){return k.match(/^\d{4}-\d{2}-\d{2}$/);});
  dates.forEach(function(date) {
    var entry = localData[date];
    // Only migrate entries that have real data, not just a savedAt
    var hasData = Object.keys(entry).filter(function(k){return k!=='savedAt'&&k!=='date'&&entry[k]!==undefined&&entry[k]!==null&&entry[k]!=='';}).length > 0;
    if (!hasData) return;
    entry.date = date;
    apiCall({action:'saveDay', user:SYNC_USER, day:JSON.stringify(entry)}, function(){});
  });
  var localSettings = {};
  try { localSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'); } catch(e){}
  if (localSettings.metrics) {
    apiCall({action:'saveSettings', user:SYNC_USER, settings:JSON.stringify(localSettings)}, function(){});
  }
}

// Auto-poll every 3 minutes so Pi display stays current
setInterval(function(){
  syncFromSheet(function(){
    renderCountdowns();
    renderToday();
  });
  syncTodosFromSheet(function(){ renderTodos(); });
}, 3 * 60 * 1000);

// ─── DAY MODAL ───────────────────────────────────────────────────
function openDayModal(dateStr) {
  var dt = new Date(dateStr+'T12:00:00');
  document.getElementById('modalDate').textContent = dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  var entry = loggedData[dateStr]||{};
  var wt = getWeeklyTotals();
  var nonGoal = settings.metrics.filter(function(m){return !m.isGoalMetric;});
  var dayTodos = todos.filter(function(t){return t.dateCompleted===dateStr;});
  
  var html = '';
  
  // Metrics section
  if (nonGoal.length) {
    html += '<div class="modal-section"><div class="modal-section-title">Metrics</div>';
    nonGoal.forEach(function(m){
      var v = entry[m.id];
      var has = v!==null&&v!==undefined;
      var sc = has?calcScore(m,v,wt):null;
      var c = scoreColor(sc);
      var disp = !has?'—':(m.type==='yn'?(v?'YES':'NO'):v+' '+m.unit);
      html += '<div class="modal-metric-row"><span>'+m.label+'</span><span style="font-weight:700;color:'+(has?c:'var(--muted)')+'">'+disp+'</span></div>';
    });
    html += '</div>';
  }

  // Goal bars section
  if (settings.goalBars.length) {
    html += '<div class="modal-section"><div class="modal-section-title">Weekly Goals</div>';
    settings.goalBars.forEach(function(gb){
      var v = entry[gb.metricId];
      var disp = v!==undefined?v+' '+gb.unit:'—';
      html += '<div class="modal-metric-row"><span>'+gb.label+'</span><span style="font-weight:700">'+disp+'</span></div>';
    });
    html += '</div>';
  }

  // Todos section
  if (dayTodos.length) {
    html += '<div class="modal-section"><div class="modal-section-title">Completed To-Dos</div>';
    dayTodos.forEach(function(t){
      html += '<div class="modal-todo-item">✓ '+t.todo+'</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="modal-section"><div class="modal-section-title">Completed To-Dos</div><div style="font-size:11px;color:var(--muted)">None</div></div>';
  }

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('dayModal').style.display = 'flex';
}

function closeDayModal() {
  document.getElementById('dayModal').style.display = 'none';
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.sec').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById('s-'+t.dataset.s).classList.add('active');
    var s=t.dataset.s;
    if(s==='today') renderToday();
    else if(s==='log'){initLogDate();renderLog();}
    else if(s==='week') renderWeek();
    else if(s==='history'){populateHistMetric();renderHist();}
    else if(s==='edit') renderEdit();
  });
});
